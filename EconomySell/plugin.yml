main: onebone\economysell\EconomySell
version: "2.0.0"
author: onebone
api: 5.0.0
depend: [EconomyAPI]

commands:
  sell:
    description: "Sell point management command"
    usage: "/sell <create|remove>"
    permission: economysell.command

permissions:
  economysell:
    default: op
    description: "Allows access to all EconomySell features"
    children:
      economysell.command:
        default: true
        description: "Allows use of sell command"
      economysell.create:
        default: true
        description: "Allows creating sell points"
      economysell.remove:
        default: true
        description: "Allows removing own sell points"
      economysell.admin:
        default: op
        description: "Allows removing any sell point"