name: EconomySell
main: onebone\economysell\EconomySell
version: "2.0.1"
api: 5.0.0

depend: [EconomyAPI]
author: onebone

commands:
 sell:
  description: EconomySell command
  usage: /sell
  permission: economysell.command.sell
permissions:
 economysell.command:
  description: Allows player to use all of sell command
  default: op
  children:
   economysell.command.sell:
    description: Allows player to use /sell command
    default: true
