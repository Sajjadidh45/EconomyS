name: EconomyCasino
main: onebone\economycasino\EconomyCasino
version: "2.0.0"
author: onebone
api: 5.0.0
depend: [EconomyAPI]

commands:
  casino:
    description: "Casino games command"
    usage: "/casino <dice|coin|lottery> <bet_amount>"
    permission: economycasino.command

permissions:
  economycasino:
    default: op
    description: "Allows access to all EconomyCasino features"
    children:
      economycasino.command:
        default: true
        description: "Allows use of casino command"